<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>4THEFEELING</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="favicon.png.png"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           CONFIGURAÇÃO GERAL
        ===================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {

            background-color: #1d3323;

            color: #ffffff;

            font-family:
                'Helvetica Neue',
                Arial,
                sans-serif;

            text-transform: uppercase;

            letter-spacing: 2px;
        }


        /* =====================================================
           CONTAINER DAS DUAS TELAS
        ===================================================== */

        .site {

            width: 200vw;

            height: 100vh;

            display: flex;

            transition:
                transform 0.8s
                cubic-bezier(0.77, 0, 0.175, 1);
        }


        /* =====================================================
           CADA PÁGINA
        ===================================================== */

        .pagina {

            width: 100vw;

            height: 100vh;

            flex-shrink: 0;

            position: relative;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            align-items: center;

            padding: 60px 20px;
        }


        /* =====================================================
           PÁGINA INICIAL
        ===================================================== */

        .topo {

            font-size: 14px;

            opacity: 1;

            text-align: center;

            font-weight: bold;
        }


        .centro {

            text-align: center;
        }


        .marca {

            font-size: 48px;

            font-weight: bold;

            letter-spacing: 6px;
        }


        /* =====================================================
           RODAPÉ
        ===================================================== */

        .rodape {

            display: flex;

            justify-content: space-between;

            align-items: center;

            width: 100%;

            max-width: 400px;
        }


        .rodape a,
        .btn-pix {

            display: inline-block;

            opacity: 0.7;

            transition:
                opacity 0.2s;

            color: #ffffff;

            text-decoration: none;
        }


        .rodape a:hover,
        .btn-pix:hover {

            opacity: 1;
        }


        .rodape svg {

            width: 22px;

            height: 22px;

            fill: currentColor;
        }


        /* =====================================================
           PIX
        ===================================================== */

        .bloco-pix {

            position: relative;

            display: inline-block;
        }


        .mini-qrcode {

            width: 80px;

            height: 80px;

            border-radius: 4px;

            background-color: #ffffff;

            padding: 3px;

            position: absolute;

            bottom:
                calc(100% + 8px);

            right: 0;

            display: block;
        }


        .btn-pix {

            font-size: 11px;

            letter-spacing: 1px;

            border:
                1px solid
                rgba(255,255,255,0.4);

            padding:
                8px 14px;

            border-radius: 4px;

            text-transform: none;

            background: none;

            cursor: pointer;

            font-family: inherit;
        }


        /* =====================================================
           SETA DIREITA
           MAIS GROSSA, ESCURA E VISÍVEL
        ===================================================== */

        .seta-direita {

            position: absolute;

            right: 30px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #000000;

            background: none;

            border: none;

            font-size: 38px;

            font-weight: 900;

            line-height: 1;

            opacity: 1;

            transition:
                transform 0.3s ease;

            cursor: pointer;

            z-index: 20;

            -webkit-text-stroke:
                1px #000000;
        }


        .seta-direita:hover {

            color: #000000;

            opacity: 1;

            transform:
                translateY(-50%)
                translateX(5px);
        }


        /* =====================================================
           PÁGINA DO PRODUTO
        ===================================================== */

        .pagina-produto {

            background-color:
                #1d3323;

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           ÁREA DE PRODUTOS

           Aumentamos o espaço entre as camisetas.
        ===================================================== */

        .produtos {

            width: 100%;

            max-width: 1300px;

            height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 150px;

            padding:
                0
                60px;
        }


        /* =====================================================
           ÁREA INDIVIDUAL DE CADA CAMISETA

           As duas possuem exatamente a mesma área,
           garantindo proporção e tamanho visual iguais.
        ===================================================== */

        .produto {

            width: 40%;

            max-width: 450px;

            height: 70vh;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-shrink: 0;
        }


        /* =====================================================
           IMAGENS DAS CAMISETAS
        ===================================================== */

        .produto img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: contain;
        }


        /* =====================================================
           PRIMEIRA CAMISETA
           MANTIDA ESTÁTICA
        ===================================================== */

        .camiseta-estatica {

            animation:
                entradaSuave
                1s
                ease
                both;
        }


        /* =====================================================
           SEGUNDA CAMISETA
           ESTÁTICA
        ===================================================== */

        .camiseta-3d {

            animation: none;

            transform: none;

            width: 100%;

            height: 100%;

            object-fit: contain;
        }


        /* =====================================================
           PREÇO
           CENTRALIZADO ENTRE AS DUAS CAMISETAS
        ===================================================== */

        .preco {

            position: absolute;

            left: 50%;

            bottom: 70px;

            transform:
                translateX(-50%);

            color: #ffffff;

            font-size: 20px;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: none;

            white-space: nowrap;

            z-index: 10;
        }


        /* =====================================================
           ENTRADA SUAVE
        ===================================================== */

        @keyframes entradaSuave {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =====================================================
           SETA ESQUERDA
        ===================================================== */

        .seta-esquerda {

            position: absolute;

            left: 30px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #ffffff;

            background: none;

            border: none;

            font-size: 26px;

            font-weight: 300;

            opacity: 0.35;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;

            cursor: pointer;

            z-index: 20;
        }


        .seta-esquerda:hover {

            opacity: 0.9;

            transform:
                translateY(-50%)
                translateX(-4px);
        }


        /* =====================================================
           CELULAR
        ===================================================== */

@media (max-width: 768px) {

    .pagina {
        padding: 40px 20px 85px 20px;
    }

    .marca {
        font-size: 34px;
        letter-spacing: 4px;
    }

    .produtos {
        gap: 30px;
        padding: 0 35px;
        height: 75%;
    }

    .produto {
        width: 45%;
        max-width: 300px;
        height: 50vh;
    }

    /* SETA DIREITA - MAIS FINA E MENOR */
    .seta-direita {
        right: 8px;
        top: 50%;
        font-size: 28px;
        font-weight: 400;
        -webkit-text-stroke: 0;
        line-height: 1;
    }

    /* SETA ESQUERDA */
    .seta-esquerda {
        left: 8px;
        top: 50%;
        font-size: 24px;
        font-weight: 400;
    }

    /* PREÇO - FORÇADO A FICAR VISÍVEL */
    .preco {
        position: absolute;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        opacity: 1;
        visibility: visible;
        display: block;
        z-index: 999;
        white-space: nowrap;
    }

/* =====================================================
   CORREÇÃO EXCLUSIVA PARA IPHONE / SAFARI
   NÃO ALTERA A VERSÃO DESKTOP
===================================================== */

@supports (-webkit-touch-callout: none) {

    .pagina-produto {
        position: relative;
        height: 100vh;
        min-height: 100vh;
        overflow: visible;
    }

    .produtos {
        height: 70vh;
        max-height: 70vh;
    }

    .preco {
        position: fixed !important;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;

        left: 50% !important;
        bottom: 25px !important;

        transform: translateX(-50%) !important;

        color: #ffffff !important;

        font-size: 20px !important;
        font-weight: 700 !important;

        line-height: 1 !important;

        z-index: 99999 !important;

        white-space: nowrap !important;

        -webkit-transform: translateX(-50%) !important;
    }

    .seta-direita {
        font-family: Arial, sans-serif !important;

        font-size: 0 !important;

        font-weight: normal !important;

        width: 22px !important;
        height: 22px !important;

        right: 10px !important;

        top: 50% !important;

        transform: translateY(-50%) !important;

        -webkit-transform: translateY(-50%) !important;

        color: #000000 !important;

        -webkit-text-stroke: 0 !important;

        text-shadow: none !important;

        border: none !important;

        background: transparent !important;
    }

    .seta-direita::after {
        content: "→";

        display: block;

        color: #000000;

        font-family: Arial, sans-serif;

        font-size: 25px;

        font-weight: 400;

        line-height: 22px;

        text-align: center;
    }
    
/* CORREÇÃO DO PREÇO NO IPHONE - NÃO ALTERA A SETA */
}
}
    </style>

</head>


<body>


    <!-- =====================================================
         CONTAINER PRINCIPAL
    ===================================================== -->

    <main
        class="site"
        id="site"
    >


        <!-- =================================================
             PRIMEIRA PÁGINA
        ================================================== -->

        <section
            class="pagina pagina-home"
        >


            <!-- TOPO -->

            <div class="topo">

                it's coming

            </div>


            <!-- CENTRO -->

            <div class="centro">

                <div class="marca">

                    4THEFEELING

                </div>

            </div>


            <!-- RODAPÉ -->

            <div class="rodape">


                <!-- X -->

                <a
                    href="https://x.com/4thefeeling"
                    target="_blank"
                    title="X"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
                        >
                        </path>

                    </svg>

                </a>


                <!-- PIX -->

                <div
                    class="bloco-pix"
                >

                    <img
                        src="qrcode.png.jpeg"
                        alt="Pix QR"
                        class="mini-qrcode"
                    >


                    <button
                        onclick="copiarPix()"
                        class="btn-pix"
                        id="pix-trigger"
                    >

                        🙏blessings🕊️

                    </button>

                </div>


            </div>


            <!-- SETA DIREITA -->

            <button
                class="seta-direita"
                onclick="abrirProduto()"
                aria-label="Ver produto"
            >

                →

            </button>


        </section>



        <!-- =================================================
             SEGUNDA PÁGINA
        ================================================== -->

        <section
            class="pagina pagina-produto"
        >


            <!-- SETA VOLTAR -->

            <button
                class="seta-esquerda"
                onclick="voltarInicio()"
                aria-label="Voltar"
            >

                ←

            </button>



            <!-- PRODUTOS -->

            <div
                class="produtos"
            >


                <!-- PRIMEIRA CAMISETA -->

                <div
                    class="produto"
                >

                    <img
                        src="camiseta.png.png"
                        alt="Camiseta 4THEFEELING"
                        class="camiseta-estatica"
                    >

                </div>



                <!-- SEGUNDA CAMISETA -->

                <div
                    class="produto"
                >

                    <img
                        src="camiseta3D.png.png"
                        alt="Camiseta 4THEFEELING"
                        class="camiseta-3d"
                    >

                </div>


            </div>



            <!-- PREÇO CENTRAL -->

            <div
                class="preco"
            >

                R$ 40,00

            </div>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        /* =====================================================
           ABRIR PÁGINA DO PRODUTO
        ===================================================== */

        function abrirProduto() {

            document
                .getElementById('site')
                .style.transform =
                'translateX(-100vw)';

        }



        /* =====================================================
           VOLTAR PARA A HOME
        ===================================================== */

        function voltarInicio() {

            document
                .getElementById('site')
                .style.transform =
                'translateX(0)';

        }



        /* =====================================================
           COPIAR PIX
        ===================================================== */

        function copiarPix() {


            const chavePix =
                "ba6e7f89-f3f9-4872-9e39-cd2dccebe393";


            const botao =
                document.getElementById(
                    'pix-trigger'
                );


            navigator
                .clipboard
                .writeText(chavePix)


                .then(() => {


                    const textoOriginal =
                        botao.innerHTML;


                    botao.innerHTML =
                        "chave pix copiado";


                    setTimeout(() => {


                        botao.innerHTML =
                            textoOriginal;


                    }, 2500);


                })


                .catch(err => {


                    alert(
                        "Chave Pix copiada com sucesso: "
                        + chavePix
                    );


                });

        }


    </script>


</body>

</html>
