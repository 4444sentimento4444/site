<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4THEFEELING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #1d3323; 
            color: #ffffff;            
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Alterado apenas aqui: adicionado cor cinza suave através de opacidade 50% */
        .topo { 
            font-size: 14px; 
            color: rgba(255, 255, 255, 0.5); 
            text-align: center; 
            font-weight: bold; 
        }
        
        .centro { text-align: center; }
        .marca { font-size: 48px; font-weight: bold; letter-spacing: 6px; }
        
        .rodape { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            max-width: 400px; 
        }
        .rodape a, .btn-pix { 
            display: inline-block; 
            opacity: 0.7; 
            transition: opacity 0.2s; 
            color: #ffffff; 
            text-decoration: none; 
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .rodape a:hover, .btn-pix:hover { opacity: 1; }
        .rodape svg { width: 22px; height: 22px; fill: currentColor; }
        
        .btn-pix { 
            font-size: 11px; 
            letter-spacing: 1px; 
            border: 1px solid rgba(255,255,255,0.4); 
            padding: 8px 14px; 
            border-radius: 4px; 
            text-transform: none;
        }
    </style>
</head>
<body>

    <div class="topo">it's coming</div>
    
    <div class="centro">
        <div class="marca">4THEFEELING</div>
    </div>
    
    <div class="rodape">
        <a href="https://x.com/4thefeeling" target="_blank" title="X">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
        </a>

        <!-- Alterado de link para botão de cópia com função Javascript -->
        <button onclick="copiarPix()" class="btn-pix" id="pix-trigger">
            🙏blessings🕊️
        </button>
    </div>

    <script>
    function copiarPix() {
        // ATENÇÃO: Substitua o texto abaixo pela sua chave aleatória gerada no Nubank
        const chavePix = ba6e7f89-f3f9-4872-9e39-cd2dccebe393; 
        
        const botao = document.getElementById('pix-trigger');
        
        navigator.clipboard.writeText(chavePix).then(() => {
            // Feedback visual rápido no próprio botão mantendo o minimalismo
            const textoOriginal = botao.innerHTML;
            botao.innerHTML = "copiado! cole no seu banco";
            setTimeout(() => {
                botao.innerHTML = textoOriginal;
            }, 2500);
        }).catch(err => {
            // Caso falhe por segurança do navegador, exibe um alerta alternativo
            alert("Use a chave para transferência Pix: " + chavePix);
        });
    }
    </script>

</body>
</html>
